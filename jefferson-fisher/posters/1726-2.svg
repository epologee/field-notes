<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .stage    { fill: #ffffff; }
      .rule     { stroke: #0e0e0e; stroke-width: 1.1; }
      .eyebrow  { font-family: "Inter", "Helvetica Neue", system-ui, sans-serif;
                  font-size: 15px; letter-spacing: 0.24em; text-transform: uppercase;
                  fill: #0e0e0e; font-weight: 600; }
      .show     { font-family: "Inter", "Helvetica Neue", system-ui, sans-serif;
                  font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
                  fill: #6b6b6b; font-weight: 500; }
      .quote    { font-family: "EB Garamond", "Sorts Mill Goudy", "Apple Garamond", Garamond, "Times New Roman", serif;
                  fill: #0e0e0e; font-weight: 500; }
      .display  { font-size: 84px; line-height: 1.04; letter-spacing: -0.012em; }
      .accent   { font-style: italic; font-weight: 500; fill: #c33a2e; }
      .attrib   { font-family: "Inter", "Helvetica Neue", system-ui, sans-serif;
                  font-size: 17px; letter-spacing: 0.18em; text-transform: uppercase;
                  fill: #0e0e0e; font-weight: 600; }
      .small    { font-family: "Inter", "Helvetica Neue", system-ui, sans-serif;
                  font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
                  fill: #6b6b6b; font-weight: 400; }
      .urltext  { font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
                  font-size: 12px; letter-spacing: 0.02em;
                  fill: #6b6b6b; font-weight: 400; }
      .context  { font-family: "EB Garamond", "Sorts Mill Goudy", "Apple Garamond", Garamond, "Times New Roman", serif;
                  font-size: 22px; line-height: 1.42; fill: #3a3a3a;
                  font-style: italic; font-weight: 400; }
    </style>
  </defs>

  <rect class="stage" width="1080" height="1350"/>

  <g transform="translate(96 96)">
    <text class="show"    y="0">Modern Wisdom · hosted by Chris Williamson</text>
    <text class="eyebrow" y="34">The Quiet Art of Leading Any Conversation</text>
    <line class="rule" x1="0" y1="58" x2="888" y2="58"/>
  </g>

  <g transform="translate(96 295)">
    <text class="quote display" x="0" y="0">
      <tspan x="0" dy="0">The harder you push,</tspan>
      <tspan x="0" dy="1.04em">the more hardened they</tspan>
      <tspan x="0" dy="1.04em">become. The more you</tspan>
      <tspan x="0" dy="1.04em">tell somebody they’re</tspan>
      <tspan x="0" dy="1.04em">wrong, the more</tspan>
      <tspan x="0" dy="1.04em">convinced they are</tspan>
      <tspan x="0" dy="1.04em">that they’re right.</tspan>
    </text>
  </g>

  <g transform="translate(96 993)">
    <text class="context" x="0" y="0">
      <tspan x="0" dy="0">Chris frames anger as an evolutionary tool: before law</tspan>
      <tspan x="0" dy="1.42em">enforcement, you needed an outsized response to deter further</tspan>
      <tspan x="0" dy="1.42em">violations. That utility is mostly obsolete. Jefferson agrees</tspan>
      <tspan x="0" dy="1.42em">and tightens the argument: pushing harder against someone you</tspan>
      <tspan x="0" dy="1.42em">want to change is the surest way to entrench them in their</tspan>
      <tspan x="0" dy="1.42em">position.</tspan>
    </text>
  </g>

  <g transform="translate(96 1196)">
    <line class="rule" x1="0" y1="0" x2="888" y2="0"/>
    <text class="attrib" x="0" y="38">Jefferson Fisher</text>
    <text class="small"  x="0" y="68">Modern Wisdom · 4 May 2026 · 28:46</text>
    <a href="https://youtu.be/AwPNjPR-vVY?t=1726" target="_blank" rel="noopener">
      <text class="urltext" x="888" y="68" text-anchor="end">youtu.be/AwPNjPR-vVY?t=1726</text>
    </a>
  </g>
</svg>
