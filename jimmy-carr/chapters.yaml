chapters:
- timestamp: 00:00:00
  timestamp_s: 0
  title: Two shows a night
  paragraphs:
  - 'Last year I did somewhere between 250 and 300 shows. Doing two a night is what ramps the numbers up, and it has been the big innovation in my touring. B.B. King had a line for it: I do the shows for free, they pay me to travel. Getting there is the hassle. The show is the joy.'
  - So in most places I do one show at seven and another at half past nine. One goes to the taxman, and the other one is all mine.
  continue_timestamp: 00:00:30
  continue_timestamp_s: 30
  quote: It’s one for me, one for HMRC.
  quote_timestamp_s: 30
- timestamp: 00:00:54
  timestamp_s: 54
  title: Hours in the sky
  paragraphs:
  - 'Doing that many shows makes me less nervous, not more. It is like being an airline pilot: it comes down to hours in the sky. I film everything now, and a good third of every show belongs only to that night, so I never get bored of it.'
  - 'I used to think a lot about jealousy and envy. Jealousy is not wanting someone else to have a thing, and it is a dark energy. Envy tells you what you want. When I watched comics like Matt Rife and Andrew Schulz blow up by filming on the road, I thought: I should do that. I copied the method and I have loved it.'
  continue_timestamp: 00:01:16
  continue_timestamp_s: 76
  quote: There’s envy, which is telling you what you want.
  quote_timestamp_s: 86
- timestamp: 00:02:13
  timestamp_s: 133
  title: The Jimmy Carr business
  paragraphs:
  - Chris has seen me backstage eating an apple minutes before walking out to seven thousand people. Part of that calm is self-selection. At a club, people have come out for comedy in general. At my shows they have come for me, so they know what they will get.
  - If anyone is offended at this point, it is like buying tickets for a horror film and complaining that you are scared. And the moments I can have with a crowd now exist because they have seen what I do online. They are expecting it.
  continue_timestamp: 00:02:44
  continue_timestamp_s: 164
  quote: I’m not in the comedy business, I’m in the Jimmy Carr business.
  quote_timestamp_s: 144
- timestamp: 00:03:30
  timestamp_s: 210
  title: Iteration
  paragraphs:
  - 'Chris read me a line about how life does not need to be easier, it needs to be simpler. Touring is one thing all the way through: get to the next show, be in a good mood, perform well.'
  - Three hundred gigs a year sounds like doing the same thing again and again, but it never is. I change the show subtly every night and try new jokes at the end of every single one. That makes it intellectually stimulating, because I am always writing.
  quote: It’s never repetition, it’s iteration.
  quote_timestamp_s: 222
- timestamp: 00:03:57
  timestamp_s: 237
  title: Thought without control
  paragraphs:
  - Why do people get stuck overthinking? Let’s have a think about it. That is like trying to sniff your way out of a cocaine problem. I suppose overthinking is anxiety in a larger form.
  - On stage I am in a flow state. I know what the jokes are, I do not have to think about them, and I can be loose with whoever talks to me. Finding something you enjoy that puts you in that state is the secret sauce.
  continue_timestamp: 00:04:26
  continue_timestamp_s: 266
  quote: Anxiety is thought without control.
  quote_timestamp_s: 257
- timestamp: 00:05:21
  timestamp_s: 321
  title: A collective problem
  paragraphs:
  - 'Mark Fisher wrote about the privatisation of anxiety and stress: we blame the individual for mental health problems. Look at how many people now suffer from depression and anxiety and you have to conclude that it is a societal problem. It is a collective action problem, and a depressed young man cannot solve it on his own.'
  - Everything is now built for the individual. What used to be a game of five-a-side on a Wednesday night is now a personal best at the gym. You track your steps instead of going for a walk with a friend. That is very isolating.
  continue_timestamp: 00:06:10
  continue_timestamp_s: 370
  quote: If you’re a depressed young man, you cannot solve the problem on your own.
  quote_timestamp_s: 347
- timestamp: 00:06:27
  timestamp_s: 387
  title: Pro-gang, pro-pub
  paragraphs:
  - After Louis Theroux’s documentary everyone talked about the manosphere. To me it is the wrong prescription for the right problem. My own take is that I am pro-gang, pro-drinking and pro-gambling. Where should men be? Together. Men are good at checking other men, and most gangs are just guys hanging out.
  - 'I have found youth clubs all over the world with jukeboxes, pool tables and sport on a big TV. They are called pubs. I would lower the drinking age to sixteen, on one condition: you have to bring three mates. Four of you will check each other, among adults of all ages, which beats drinking alone in a park.'
  continue_timestamp: 00:07:23
  continue_timestamp_s: 443
  quote: The risk to your liver is as nothing compared to the risk of social isolation.
  quote_timestamp_s: 430
- timestamp: 00:08:23
  timestamp_s: 503
  title: Deal them in
  paragraphs:
  - 'Young people gamble online because they cannot see another way out. The real gamble should be on yourself: on a career, on saying out loud that you are ambitious. The younger generation needs to be dealt in, and right now they are not.'
  - What hope is there of buying a house and starting a family? It is not that they do not want to; they are not given the conditions. So no tax under thirty. Chris mentioned Rory Sutherland’s version, where your first 250,000 is tax-free, and Bill Perkins’ idea of giving children their inheritance at thirty. It is as if we have inverted Maslow’s hierarchy.
  continue_timestamp: 00:09:01
  continue_timestamp_s: 541
  quote: I don’t think there should be any tax on the under 30s.
  quote_timestamp_s: 541
- timestamp: 00:10:01
  timestamp_s: 601
  title: A time machine
  paragraphs:
  - Two hundred years ago people worried about starving but were proud of their name. Now we are fine calorifically, and we are anxious. In the moment you tend to be fine, yet people struggle to sit in the moment. Chris points out that his best flow states on stage leave almost no memory at all.
  - 'Eckhart Tolle’s story helps me here. Deeply depressed in his twenties, he sat on a park bench thinking: I cannot live with myself. Then he asked who the I was and who the myself was. There is an equanimity in being able to separate yourself from your thoughts.'
  continue_timestamp: 00:11:39
  continue_timestamp_s: 699
  quote: I think happiness is a time machine. I think depression is thinking about the past and anxiety is a worry about a future self.
  quote_timestamp_s: 618
- timestamp: 00:12:18
  timestamp_s: 738
  title: Embrace the chaos
  paragraphs:
  - 'I blame Plato and the Zoroastrians for inventing heaven and perfection. There is no perfection. I am with Nietzsche on this: embrace the chaos. You have no control over what happens, only over how you react to it, and that becomes very stoic very quickly.'
  - Chris asks whether you are depressed or whether your life is depressing. I would ask whether it is depression or sadness. If it is circumstantial, it is probably sadness, and it has become more acceptable to say you are depressed than to say you are sad.
  continue_timestamp: 00:13:03
  continue_timestamp_s: 783
  quote: Control is an illusion right the way down.
  quote_timestamp_s: 738
- timestamp: 00:13:16
  timestamp_s: 796
  title: Not a horoscope
  paragraphs:
  - You will not find a bigger Neil Howe fan than me, and he coined the word millennial, but I do not really believe in generations. Putting a whole cohort into one box makes about as much sense to me as horoscopes. Donald Trump and Joe Biden are in the same generation, and they are very different people.
  - In every cohort there are entitled people and ambitious people. The difference is where you are and where you want to get to, and whose job you think it is to get you there.
  continue_timestamp: 00:13:43
  continue_timestamp_s: 823
  quote: If you want to do something about it, you’re ambitious.
  quote_timestamp_s: 831
- timestamp: 00:14:44
  timestamp_s: 884
  title: The overproduction of elites
  paragraphs:
  - We have effectively raised the school leaving age to twenty-one. A degree is a luxury item, a Louis Vuitton handbag, and when everyone has one its value drops. Peter Turchin names two reasons societies collapse. The first is inequality of wealth, which social media has supercharged because everyone sees everything.
  - The second is the overproduction of elites. You work hard, get a good degree, and then ask where the four-bedroom house and the family are. When the system does not deliver what it tacitly promised, that elite becomes a counter-elite that fights to bring the system down.
  continue_timestamp: 00:15:20
  continue_timestamp_s: 920
  quote: That’s why we’re kind of in the beginnings of a revolution at the moment.
  quote_timestamp_s: 947
- timestamp: 00:16:59
  timestamp_s: 1019
  title: Abundance
  paragraphs:
  - 'Politically I care less about equality than about abundance. Will the next fifty years look like Star Wars or Star Trek? Even abundance gets normal: show your great-great-grandfather your life and he would think you had been made emperor. Money is really just the route to healthcare, education and the right amount of calories.'
  - 'Physical needs are a collective action problem, a safety net that is not a hammock. Metaphysical needs you cannot provide: the difference between a Casio that tells the time and a Rolex that says you made it. We are full of mimetic desire. Getting stuff is fun. Having stuff is not.'
  continue_timestamp: 00:18:01
  continue_timestamp_s: 1081
  quote: That thing of not having to impress other people, that’s the superpower.
  quote_timestamp_s: 1114
- timestamp: 00:20:23
  timestamp_s: 1223
  title: Limitations are freeing
  paragraphs:
  - It is not easy for young people to hear, but limitations are very freeing. Once you decide what you will work at and who you will be with, life gets simple.
  - Alex Hormozi, whom I met for the first time recently, is very good on this. There is too much optionality, and an option you never cash in is worthless. Do not stack an MBA, a master’s and a PhD in business. Start a business, and if it goes bust, start another. The map is not the territory.
  continue_timestamp: 00:21:20
  continue_timestamp_s: 1280
  quote: You stop thinking about how to live and you start thinking about living.
  quote_timestamp_s: 1236
- timestamp: 00:24:41
  timestamp_s: 1481
  title: Systems beat goals
  paragraphs:
  - A six-pack does not give you confidence; being the guy who shows up at the gym every day does. Chris read a Mark Manson line about small unspoken things collecting interest, and to me it is compound interest everywhere. Buffett built most of his wealth after sixty, because time was the factor. Compound interest on your skills is insane too.
  - Everyone has big goals. What will you do tomorrow? Jokes are wonderful for that. You sit down and write one, then find an audience and tell it. There is no point in a meeting about it. They will tell you straight away whether it is funny.
  continue_timestamp: 00:25:35
  continue_timestamp_s: 1535
  quote: Your goals will be beaten by your systems every time.
  quote_timestamp_s: 1525
- timestamp: 00:26:35
  timestamp_s: 1595
  title: The laugh betrays you
  paragraphs:
  - 'My favourite noise in comedy is still the cognitive dissonance laugh: a laugh followed by a deep intake of breath, when people are shocked at themselves. They laughed because the laughter comes from a deeper level of them than their opinions do.'
  - Chris thinks music pierces your defences even more than comedy. That raises the old question of the art and the artist. Can someone who has done a terrible thing still be funny, or musically gifted? I think you can probably tease those apart.
  continue_timestamp: 00:27:32
  continue_timestamp_s: 1652
  quote: The laughter kind of betrays you.
  quote_timestamp_s: 1607
- timestamp: 00:27:58
  timestamp_s: 1678
  title: Turn me over
  paragraphs:
  - 'Chris quoted Peter Crone: who could you be in the absence of your concerns? It reminds me of a line: you can do anything you want, you only have to face the consequences. You have absolute freedom, but you have to wear it. Freedom of speech is not freedom from consequence.'
  - 'I think about Saint Lawrence a lot, the patron saint of comedy. An emperor had him burned alive over a fire, and as he burned he said: turn me over, this side’s done. That is bravery in a truly awful moment, and it is the only reason we remember him.'
  continue_timestamp: 00:28:14
  continue_timestamp_s: 1694
  quote: Turn me over, this side’s done.
  quote_timestamp_s: 1713
- timestamp: 00:29:12
  timestamp_s: 1752
  title: Where you finish
  paragraphs:
  - 'Chris and George keep saying that people are held back by a lack of confidence rather than a lack of competence. Hormozi has the line: self-confidence comes from giving the world irrefutable proof that you are who you say you are.'
  - So find something small you can do. Do what you can, with what you have, where you are. You could wish away the first two, but accepting where you are and working with it is powerful.
  quote: You can’t choose where you start. You just choose where you finish.
  quote_timestamp_s: 1778
- timestamp: 00:29:42
  timestamp_s: 1782
  title: Thank you
  paragraphs:
  - I do a lot of gratitude practice. Meister Eckhart said that if the only prayer you ever said was thank you, that would be enough. Where you are in the world matters less than how you meet it, and the only thing that seems to shift that is gratitude. Celebration, done correctly, is gratitude in action, and you cannot really celebrate on your own.
  - Chairman Mao said you cannot smell the roses from a galloping horse. I should publish a book of incredibly wise things said by terrible people. Stopped clocks are right twice a day.
  continue_timestamp: 00:31:07
  continue_timestamp_s: 1867
  quote: Disposition is more important than position.
  quote_timestamp_s: 1800
- timestamp: 00:32:09
  timestamp_s: 1929
  title: Problems are features
  paragraphs:
  - Problems are a feature, not a bug. A problem just means something needs your attention. People imagine that one day their problems will be over. They will not. You level up and get more complex problems, and if you can solve really complex problems, you are doing very well.
  - Boredom is a serene moment with nothing going on. I can get to where Tibetan monks get to in an airport lounge in Detroit, as long as I do not take my phone out, which we now carry everywhere like a mobile labour camp tracking our every mood.
  continue_timestamp: 00:32:57
  continue_timestamp_s: 1977
  quote: Boredom, I think, is unappreciated serenity.
  quote_timestamp_s: 1977
- timestamp: 00:34:08
  timestamp_s: 2048
  title: Four in the morning
  paragraphs:
  - 'My mind races. I often wake at four or five in the morning with what you might call a panic attack, ruminating on counterfactuals: things going wrong, people getting hurt. If I give it a job, like writing a joke about the prime minister, it settles. Action cures it pretty well.'
  - Chris wonders how many people have a problem-solving brain and no good problems to solve. Is that not what the news is? If you wanted to design something to damage mental health, you would make people aware of a problem and give them no agency.
  continue_timestamp: 00:35:10
  continue_timestamp_s: 2110
  quote: You’d make someone aware of a problem and give them no agency.
  quote_timestamp_s: 2114
- timestamp: 00:35:58
  timestamp_s: 2158
  title: Agency and empathy
  paragraphs:
  - We give empathy to people we like and agency to people we do not. Picture two marches. Far-right skinheads put a brick through a window, and we say lock them up and throw away the key.
  - Marchers for social justice throw a brick, and we call it the language of the unheard. You should give both to both. Believe that people can handle it, and believe that everyone has a part to play.
  quote: You need agency and empathy for everyone.
  quote_timestamp_s: 2200
- timestamp: 00:40:37
  timestamp_s: 2437
  title: Level up
  paragraphs:
  - Chris quotes Michael Smokes on struggling to celebrate achievements you considered your obligation. I think you need a dose of imposter syndrome every eighteen months or two years. You need to keep levelling up, and if you are near the top of one game, you can change games.
  - I am in the service industry. I make something people want and it makes them happy. Tonight’s show is nothing more than an advert for the show when I come back. And lately every show has moments where someone asks something and we connect in a more heartfelt way, sweetened with laughter.
  continue_timestamp: 00:41:23
  continue_timestamp_s: 2483
  quote: No one seems to remember any of my jokes, but they remember how I made them feel.
  quote_timestamp_s: 2469
- timestamp: 00:41:49
  timestamp_s: 2509
  title: No filter
  paragraphs:
  - Laughter is the shortest distance between two people. Your best friend is the person you have the least filter with. Talk to a stranger on a plane about the World Cup and it stays on the surface. Tell someone you have to show them these incredible haemorrhoids, and you are connecting at another level.
  - Treat an audience like that and you get paid back ten times over. People feel you are treating them like adults and saying what you really find funny. As the mainstream media talks less about certain things, there is a gap for that conversation.
  continue_timestamp: 00:42:24
  continue_timestamp_s: 2544
  quote: Your best friend is the person you have the least filter with.
  quote_timestamp_s: 2525
- timestamp: 00:43:02
  timestamp_s: 2582
  title: The Overton window
  paragraphs:
  - The Overton window in politics is the range of things you can say at a dinner party. Comedy does that for conversation. The real benefit of a comedy show is not the two hours of laughing; it is the conversation on the way home, once the window has widened. Carlin and Pryor widened it for sex and politics, and Chappelle is widening it now.
  - 'Chris adds an emotional window: how sincere you are allowed to be. I am happy to be funny about third-rail topics and happy to be earnest. If you do anything even vaguely out there, turn off the comment section. We all contain multitudes.'
  continue_timestamp: 00:45:17
  continue_timestamp_s: 2717
  quote: Other people’s opinion of me is none of my business.
  quote_timestamp_s: 2721
- timestamp: 00:46:27
  timestamp_s: 2787
  title: Laughs and silence
  paragraphs:
  - 'Laughter is the main metric in comedy. You want three big laughs a minute. But also silence: a poignant moment where everyone has a little think. It keeps the job exciting, because I am not doing the same show again and again.'
  - We used to gather around the fire and talk, then around the radio, then around the television, watching shows we did not even like because Mum liked them. Now everyone is alone on their own stream, even in the same living room.
  continue_timestamp: 00:47:20
  continue_timestamp_s: 2840
  quote: Don’t be afraid of silence.
  quote_timestamp_s: 2800
- timestamp: 00:48:25
  timestamp_s: 2905
  title: Nets and webs
  paragraphs:
  - 'At school I learned that some Native American peoples believed a photograph would steal their soul, and I thought that was ridiculous. Now I think: maybe not one photo, but a thousand a day will do it. You end up alienated from yourself. Even the language gives it away. It is the web, the internet.'
  - Aldous Huxley was right. Our power will not be taken by an overlord; we will give it away for cheap dopamine. He called it soma, a tablet, and he was even right about that. It is just a different kind of tablet.
  continue_timestamp: 00:49:01
  continue_timestamp_s: 2941
  quote: What do nets and webs do? They catch people.
  quote_timestamp_s: 2941
- timestamp: 00:50:13
  timestamp_s: 3013
  title: A god in our image
  paragraphs:
  - 'AI is like a musical instrument. Anyone can make a noise at a piano, but a symphony takes practice. I do not think we were made in God’s image. I think we so wanted there to be a God that we made one in ours: all-knowing, all-powerful, performing miracles and living in a cloud.'
  - Everyone is impressed with AI because they have forgotten what they are. It is great at left-brain work, which apprehends; the right brain comprehends. We can only see the jobs it will take, because the ones it creates do not exist yet. Industry made physical strength obsolete; this may take the drudgery out of white-collar work.
  continue_timestamp: 00:51:10
  continue_timestamp_s: 3070
  quote: We so wanted there to be a God, we created one in our image.
  quote_timestamp_s: 3043
- timestamp: 00:54:52
  timestamp_s: 3292
  title: The end of Pax Americana
  paragraphs:
  - Chris read the line that favourable conditions never come. It does feel like a unique time. Since the Berlin Wall fell we went from a bipolar to a unipolar world, and nobody noticed for thirty years. As the American navy shrank, the canary in the coal mine was the Somali pirates. Now we live in a confusing, multipolar world.
  - Take revolution to mean the replacement of elites, and you can see one going on. The mainstream media is being replaced, academia has a replication crisis, and Britain’s century-old parties may never win again. Robert Frost said civilisation is a clearing in the forest, and we have to rebuild it. These are hard times, but I do not think they are unfixable.
  continue_timestamp: 00:55:49
  continue_timestamp_s: 3349
  quote: The canary in the coal mine was the Somali pirates.
  quote_timestamp_s: 3320
- timestamp: 01:00:30
  timestamp_s: 3630
  title: Fixing Britain
  paragraphs:
  - 'Fixing the UK needs radical realism. Two percent on income tax either way is rearranging deck chairs on the Titanic. Four things decide a country’s competitiveness: currency, energy, red tape and tax. I would devalue the pound, because you should care more about the fifty weeks you work than the two weeks in France. And I would be as technologically ambitious as France in the seventies, which built 56 nuclear plants.'
  - Then cut the red tape, which feels like the end of the Soviet Union. Tax is close to my heart. After the Soviet era, Estonia made a one-page tax form, a flat rate, and a law that the government cannot ask you for the same information twice. Britain has to compete, so people come here, start businesses and want to live here.
  continue_timestamp: 01:04:11
  continue_timestamp_s: 3851
  quote: I’m not interested in equality, I’m interested in abundance.
  quote_timestamp_s: 3879
- timestamp: 01:05:34
  timestamp_s: 3934
  title: Fixing America
  paragraphs:
  - I could fix America in two moves. First, open primaries for everything, so candidates have to appeal to the centre rather than their base. Ninety percent of people agree about ninety percent of things. Second, term limits for the Senate and Congress.
  - The American Constitution is an amazing piece of technology, but you have to work it. It is not something that just sits there. It is an active thing.
  continue_timestamp: 01:06:01
  continue_timestamp_s: 3961
  quote: I don’t blame Donald Trump for being powerful. I blame the checks and balances for not checking and balancing.
  quote_timestamp_s: 3961
- timestamp: 01:08:07
  timestamp_s: 4087
  title: The terrible truth
  paragraphs:
  - 'Chris quoted David Ogilvy: you cannot save souls in an empty church. The most difficult and most beautiful part of my current show is where I talk about suicide and tell people the terrible truth: it does not work. People want to get rid of the pain, but all they can ever do is redistribute it to the people who loved them.'
  - 'There is a non-zero number of people in every audience who are suffering and who hear that the burden is theirs to carry. Chris adds that most men who took their lives had sought professional help first. Rilke put it best: feel everything, beauty and terror. No feeling is final.'
  continue_timestamp: 01:09:35
  continue_timestamp_s: 4175
  quote: No feeling is final.
  quote_timestamp_s: 4179
  content_note: suicide
- timestamp: 01:10:07
  timestamp_s: 4207
  title: Uncomfortable conversations
  paragraphs:
  - Compound interest works on the good things, like saving and building skills, and on the bad ones too. Unaddressed problems get worse. You could probably track the quality of someone’s life by how many uncomfortable conversations they are willing to have.
  - 'We have paleolithic emotions, medieval institutions and godlike technology, and now AI on top. People need to be connected. That is my business model: getting people out of the house and into a room to laugh together, even with strangers. It is like church.'
  continue_timestamp: 01:12:13
  continue_timestamp_s: 4333
  quote: They’ve had to put pants on.
  quote_timestamp_s: 4368
- timestamp: 01:14:47
  timestamp_s: 4487
  title: The oligarchy of the arts
  paragraphs:
  - I worry about an oligarchy in the arts. A handful of films take most of the box office, a handful of artists dominate music, and books are going the same way. I hope comedy stays broad, and I want more people doing it rather than just watching. That is why I wrote a book on jokes with my friends Abi Grant and Amanda Baker.
  - Can anyone become funny? I think so. Everyone has a story to tell. Stand-up should be taught in schools, and it probably has more going for it than grade eight piano when it comes to a best man’s speech, a presentation at work or talking to your partner.
  continue_timestamp: 01:15:47
  continue_timestamp_s: 4547
  quote: It’s ordering your thoughts, writing them down and finding your own authentic voice.
  quote_timestamp_s: 4551
- timestamp: 01:16:30
  timestamp_s: 4590
  title: Snapping awake
  paragraphs:
  - 'Think about what jokes are, in Kahneman’s terms. The setup invites first-order thinking: you assume where it is going. The punchline snaps you into second-order thinking. Your brain is a pattern-recognition machine, basically an LLM, and comedy wakes it up.'
  - That is quite childlike. Children really think, and grown-ups past a certain age mostly recognise patterns. Comedians keep the ability to look at things fresh, which is a very attractive way of being.
  continue_timestamp: 01:17:11
  continue_timestamp_s: 4631
  quote: The brain is designed to not have to think.
  quote_timestamp_s: 4617
- timestamp: 01:17:51
  timestamp_s: 4671
  title: Gregorian chants
  paragraphs:
  - 'Do you know why you have heard of Gregorian chants? Pope Gregory found local churches singing the songs differently and wanted them written down. His bishops said music was ethereal and could not be written. He said: I am the Pope, write it down. Four hundred years later, Bach, Mozart and Beethoven could not have existed without that notation.'
  - Comedy is a young medium, and there is too much talk of funny bones and winging it. Knowing how jokes work does not diminish them. Most men lead lives of quiet desperation and go to the grave with the song still in them. I do not want that to happen.
  continue_timestamp: 01:18:47
  continue_timestamp_s: 4727
  quote: There’s too much magical thinking in my business.
  quote_timestamp_s: 4727
- timestamp: 01:21:10
  timestamp_s: 4870
  title: Writing is the job
  paragraphs:
  - 'Every trade used to have a guild and a secret society, a magic circle. Most comedians I know do not really know how they write jokes; they find them on stage and note them down. They are virtuoso musicians who cannot read notation, so they cannot teach it. I would like to throw the rope down and say: come on, we can all do this.'
  - Writing is the job. It is self-assignment. No manager ever sits a comedian down and tells them to write; everyone just assumes it happens. That preparation is why you succeed or fail.
  continue_timestamp: 01:21:51
  continue_timestamp_s: 4911
  quote: Writing is self-assignment.
  quote_timestamp_s: 4913
- timestamp: 01:23:44
  timestamp_s: 5024
  title: The only
  paragraphs:
  - Know the rules first, then break them all, like surreal comics such as Vic and Bob. In comedy there is no best; a top ten list is meaningless because it is about what makes you laugh. The more someone is themselves on stage, the more people gravitate towards them. It is not a competition, it just makes the pie bigger.
  - 'With six months to make an unfunny person funny, I would start with their story. What could they say that no one else could say? Everyone has a sense of humour. Taste in comedy is like taste in food and sex: some people like spicy, some like vanilla.'
  continue_timestamp: 01:24:25
  continue_timestamp_s: 5065
  quote: With comedy, you don’t want to be the best, you want to be the only.
  quote_timestamp_s: 5024
- timestamp: 01:25:18
  timestamp_s: 5118
  title: Ninety-two beats
  paragraphs:
  - There seems to be a rhythm that works. Speak at about ninety-two beats per minute and audiences tune in, for comedy, spoken word and political speeches alike. I Have a Dream is at ninety-two, and so is Obama, who speaks slowly but sits on that beat. It is not speed, it is where you put the intonation.
  - 'The most durable template is the pull-back reveal, like a comic strip that pulls back to show he is on the bus. The ha-ha and the aha are very similar. The oldest joke I know is from an ancient Roman joke book: the barber asks how you want your haircut, and you say, in silence.'
  continue_timestamp: 01:26:19
  continue_timestamp_s: 5179
  quote: How do you want your haircut? And the guy says, in silence.
  quote_timestamp_s: 5233
- timestamp: 01:27:58
  timestamp_s: 5278
  title: A couple of ballads
  paragraphs:
  - 'Putting crowd work online has grown the audience and deepened the connection. Five years ago people said thanks for the show; now they want a conversation. My stand-up persona and my podcast mode are merging. Don’t panic: there will still be ninety minutes of bang-on one-liners, and also half an hour of chat about life.'
  - Chris and George have been part of that shift. If a band only plays floor-fillers, it gets one-note; you need a couple of ballads. I love that it feels live in the room and will not happen again. The quicksilver of it.
  continue_timestamp: 01:28:57
  continue_timestamp_s: 5337
  quote: You need a couple of ballads in there.
  quote_timestamp_s: 5347
- timestamp: 01:30:13
  timestamp_s: 5413
  title: Discarded thoughts
  paragraphs:
  - 'Chris worries that the big life lessons always sound like clichés. I do not think they are trite. The commenters above it all, saying systems beat goals, rubbish: well, what have you done? Being cynical in your early twenties is fine. At some point you ask what you can do.'
  - I feel I cut my way through the jungle with a machete to become a comedian, so now it is incumbent on me to point out the path. Emerson said that in the work of genius we recognise our own rejected thoughts. You read five hundred pages and one line remains. That is the nugget, and if it changes you a little, fantastic.
  continue_timestamp: 01:31:01
  continue_timestamp_s: 5461
  quote: In the work of genius, we see our own discarded thoughts.
  quote_timestamp_s: 5512
- timestamp: 01:33:43
  timestamp_s: 5623
  title: Getting good at stuff
  paragraphs:
  - 'Chris asks about my trajectory. I care more about something else: people are happiest when they are getting good at stuff. Competence matters so much, and so does feeling yourself improve, like a child who could not ride a bike and then could.'
  - 'Comedy has endless tricks, so you keep getting slightly better, like kaizen or British cycling. And every eighteen months I try to push myself out of my comfort zone: a bigger tour, different rooms, or holding silence and space on stage in a way that feels new.'
  continue_timestamp: 01:34:13
  continue_timestamp_s: 5653
  quote: When are people happy? When they’re getting good at stuff.
  quote_timestamp_s: 5623
- timestamp: 01:35:46
  timestamp_s: 5746
  title: A pirate’s life
  paragraphs:
  - 'In my mid-twenties I left my job and told my friends I wanted to be a comedian. They thought I was having a breakdown, because they only saw the beginning. I was thinking: yo ho ho, a pirate’s life for me. You have to leave who you were behind, and there is grief in that lonely chapter.'
  - 'The two most important days are the day you are born and the day you find out why. I am a big advocate of specialisation: find the thing you cannot stop thinking about. If you would do it anyway, do it, even if it stays a hobby rather than the way you make money.'
  continue_timestamp: 01:37:12
  continue_timestamp_s: 5832
  quote: What’s play to you and work for them? That’s kind of where your edge is.
  quote_timestamp_s: 5850
- timestamp: 01:41:59
  timestamp_s: 6119
  title: Obsession
  paragraphs:
  - Chris talks about obsession as the freest form of discipline. It is linked to addiction. People with addictive personalities never really get over the addiction, they just get addicted to something else. Some of my best friends in AA became addicted to the gym, or to eating right.
  - It is compulsive behaviour. But if you can direct it at something that builds, grows and feeds back, that is fantastic. Just let it take over your life for a while.
  quote: As long as it’s not fentanyl, great.
  quote_timestamp_s: 6180
- timestamp: 01:44:25
  timestamp_s: 6265
  title: Unevenly distributed
  paragraphs:
  - We shut down the asylums in the eighties after watching One Flew Over the Cuckoo’s Nest, and we did not run out of people who need care. Homelessness is ultimately a drugs, addiction and mental health problem. Building houses is only a small part of the answer. Touring fifty countries, I keep coming back to William Gibson’s line about the future.
  - 'Lisbon turned it around. Portugal legalised drugs, but that is only half the story: they ring-fenced the money they had spent fighting the drugs war and put it into rehabilitation, education and housing. Petty crime fell off a cliff. It is creeping back now, because politics forgets why the money was being spent.'
  continue_timestamp: 01:45:45
  continue_timestamp_s: 6345
  quote: The future is here, but it’s not evenly distributed.
  quote_timestamp_s: 6320
- timestamp: 01:47:27
  timestamp_s: 6447
  title: A hot take on weed
  paragraphs:
  - Here is my hot take on marijuana. It should be illegal for under-thirties, because it is a performance-inhibiting drug. It takes away drive in the years when you are out of school and have to be a self-starter.
  - From thirty to fifty it should be legal; you are a grown-up. From fifty up, mandatory. Not because it is a good drug, but because it would redistribute wealth to the young while the old were slightly out of it.
  quote: 50 and above, mandatory.
  quote_timestamp_s: 6481
- timestamp: 01:50:22
  timestamp_s: 6622
  title: We don’t need you
  paragraphs:
  - 'Chris says nobody is coming to save you also means nobody is coming to stop you. And nobody cares more than you. Of course you want a safety net, but universal basic income is a bit too close to saying: we do not need you. Morgan Housel says happiness is freedom plus purpose. Nobody looks at their newborn and hopes for great benefits.'
  - 'In liberal democracy we have oversold the liberal and underused the demos. There is not enough connection between people: family, friends and community. Take care of the basics for everyone, then let it be abundance, the exciting, fun life you want for your kids.'
  continue_timestamp: 01:52:07
  continue_timestamp_s: 6727
  quote: Universal basic income is a bit too close to ‘we don’t need you’.
  quote_timestamp_s: 6642
- timestamp: 01:53:22
  timestamp_s: 6802
  title: Expectation inflation
  paragraphs:
  - 'Morgan Housel says the biggest inflation is expectation inflation. I remember the seventies, and they were terrible. The other name for rising expectations is progress. The biggest problems are the unsexy easy fixes: burning biomass indoors kills millions of people a year, and smoking, solved at home, still spreads elsewhere.'
  - Net zero is the same kind of problem. Short term it hurts the poor most, so aim for twenty-five years, but start building the nuclear plants now. That takes statesmen. If Britain did it first, we would look like geniuses in twenty-five years, and near-zero energy would bring businesses to us.
  continue_timestamp: 01:55:30
  continue_timestamp_s: 6930
  quote: The other name for expectation inflation is progress.
  quote_timestamp_s: 6818
- timestamp: 01:57:13
  timestamp_s: 7033
  title: A place with a past
  paragraphs:
  - 'The fancy term is oikophobia, the hatred of your own culture. People should take more pride. It is not obvious that a place without a past has a future. We beat the Nazis and ended slavery, and the English language is a beautiful thing. George Mack plays Top Trumps with Britain: music, the Beatles; physics, Stephen Hawking; the internet, Tim Berners-Lee.'
  - Coming on this show has really changed me as a performer. It has been incredibly valuable, hopefully in the right direction. The comment section will decide.
  continue_timestamp: 01:58:17
  continue_timestamp_s: 7097
  quote: It’s not immediately apparent that a place without a past has a future.
  quote_timestamp_s: 7039
